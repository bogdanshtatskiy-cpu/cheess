<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chess Print Calculator</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
</head>
<body>
    <div class="ambient-background"></div>
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
    
    <div class="app-container">
        <header class="ios-glass">
            <div class="header-top">
                <h1>ChessCalc</h1>
                <button id="header-auth-btn" class="auth-toggle-btn" onclick="openAuthModal()">Войти</button>
            </div>
            <nav>
                <button class="nav-btn active" data-tab="view">Расчет</button>
                <button class="nav-btn admin-only hidden" data-tab="admin-resin">Смолы</button>
                <button class="nav-btn admin-only hidden" data-tab="admin-sets">Наборы</button>
            </nav>
        </header>

        <main>
            <!-- Вкладка: Просмотр и расчет -->
            <section id="view" class="tab-content active">
                <div class="ios-glass card">
                    <h2 class="section-title">Калькулятор</h2>
                    
                    <div class="photo-preview-container" id="calc-photo-container" style="display: none;">
                        <img id="calc-set-photo" src="" alt="Set Photo">
                    </div>

                    <div class="input-group">
                        <label>Набор</label>
                        <select id="select-set" onchange="updateCalcPhoto()"><option>Загрузка...</option></select>
                    </div>
                    <div class="input-group">
                        <label>Смола (Белые)</label>
                        <select id="select-resin-white"></select>
                    </div>
                    <div class="input-group">
                        <label>Смола (Черные)</label>
                        <select id="select-resin-black"></select>
                    </div>
                    <button class="action-btn primary" onclick="calculateTotal()">Рассчитать</button>
                    
                    <div id="results" class="results-container hidden"></div>
                </div>
            </section>

            <!-- Вкладка: СМОЛЫ -->
            <section id="admin-resin" class="tab-content">
                <div class="ios-glass card">
                    <h2 id="resin-form-title" class="section-title">Добавить смолу</h2>
                    <div class="input-group"><input type="text" id="resin-brand" placeholder="Производитель"></div>
                    <div class="input-group"><input type="text" id="resin-name" placeholder="Название (ABS-like...)"></div>
                    <div class="input-group"><input type="text" id="resin-color" placeholder="Цвет"></div>
                    <div class="input-group"><input type="number" id="resin-price" placeholder="Цена за 1кг (грн)"></div>
                    <div class="input-group"><input type="number" step="0.01" id="resin-density" placeholder="Густота (g/cm³)"></div>
                    
                    <div class="form-actions">
                        <button class="action-btn primary" id="btn-save-resin" onclick="saveResin()">Сохранить</button>
                        <button class="action-btn secondary hidden" id="btn-cancel-resin" onclick="cancelResinEdit()">Отмена</button>
                    </div>
                </div>
                
                <div class="ios-glass card mt-15">
                    <h2 class="section-title">База смол</h2>
                    <div id="admin-resin-list" class="item-list"></div>
                </div>
            </section>

            <!-- Вкладка: НАБОРЫ -->
            <section id="admin-sets" class="tab-content">
                <div class="ios-glass card">
                    <h2 id="set-form-title" class="section-title">Добавить набор</h2>
                    <div class="input-group"><input type="text" id="set-name" placeholder="Название набора"></div>
                    
                    <div class="input-group">
                        <label>Фотография</label>
                        <div class="file-upload-wrapper">
                            <input type="file" id="set-photo-file" accept="image/*" class="file-input">
                        </div>
                        <input type="hidden" id="set-photo-url">
                        <div id="upload-preview" class="photo-preview-container hidden mt-10">
                            <img id="preview-img" src="">
                        </div>
                    </div>
                    
                    <div class="flex-row">
                        <div class="input-group"><input type="number" id="time-white" placeholder="Время белые (ч)"></div>
                        <div class="input-group"><input type="number" id="time-black" placeholder="Время черные (ч)"></div>
                    </div>

                    <h3 class="subsection-title">Параметры фигур (1 шт)</h3>
                    <div class="pieces-wrapper">
                        <!-- Фигуры -->
                        <div class="piece-card">
                            <div class="piece-title">Король</div>
                            <input type="number" id="w-king" placeholder="Вес (г)"><input type="number" id="h-king" placeholder="H (мм)"><input type="number" id="d-king" placeholder="Ø (мм)">
                        </div>
                        <div class="piece-card">
                            <div class="piece-title">Королева</div>
                            <input type="number" id="w-queen" placeholder="Вес (г)"><input type="number" id="h-queen" placeholder="H (мм)"><input type="number" id="d-queen" placeholder="Ø (мм)">
                        </div>
                        <div class="piece-card">
                            <div class="piece-title">Офицер</div>
                            <input type="number" id="w-bishop" placeholder="Вес (г)"><input type="number" id="h-bishop" placeholder="H (мм)"><input type="number" id="d-bishop" placeholder="Ø (мм)">
                        </div>
                        <div class="piece-card">
                            <div class="piece-title">Конь</div>
                            <input type="number" id="w-knight" placeholder="Вес (г)"><input type="number" id="h-knight" placeholder="H (мм)"><input type="number" id="d-knight" placeholder="Ø (мм)">
                        </div>
                        <div class="piece-card">
                            <div class="piece-title">Ладья</div>
                            <input type="number" id="w-rook" placeholder="Вес (г)"><input type="number" id="h-rook" placeholder="H (мм)"><input type="number" id="d-rook" placeholder="Ø (мм)">
                        </div>
                        <div class="piece-card">
                            <div class="piece-title">Пешка</div>
                            <input type="number" id="w-pawn" placeholder="Вес (г)"><input type="number" id="h-pawn" placeholder="H (мм)"><input type="number" id="d-pawn" placeholder="Ø (мм)">
                        </div>
                    </div>

                    <div class="form-actions mt-15">
                        <button class="action-btn primary" id="btn-save-set" onclick="saveSet()">Сохранить набор</button>
                        <button class="action-btn secondary hidden" id="btn-cancel-set" onclick="cancelSetEdit()">Отмена</button>
                    </div>
                </div>

                <div class="ios-glass card mt-15">
                    <h2 class="section-title">База наборов</h2>
                    <div id="admin-sets-list" class="item-list"></div>
                </div>
            </section>
        </main>
    </div>

    <!-- Модальное окно авторизации (Стиль iOS Alert) -->
    <div id="auth-modal-overlay" class="modal-overlay hidden">
        <div class="ios-glass modal">
            <h3>Вход в систему</h3>
            <p>Авторизуйтесь для управления базой</p>
            <div class="input-group"><input type="email" id="auth-email" placeholder="Email"></div>
            <div class="input-group"><input type="password" id="auth-pass" placeholder="Password"></div>
            <div class="modal-actions">
                <button class="modal-btn cancel" onclick="closeAuthModal()">Отмена</button>
                <button class="modal-btn confirm" onclick="loginAdmin()">Войти</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
